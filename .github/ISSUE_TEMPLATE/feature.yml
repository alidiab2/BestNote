name: Feature idea
description: Suggest something new
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: refs
    attributes:
      label: How do other apps handle it? (Goodnotes, Samsung Notes, Notability…)
