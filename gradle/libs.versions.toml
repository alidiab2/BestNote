# BestNote version catalog. Latest stable releases on Google Maven / Maven Central
# as of 2026-10, except androidx.ink (see below).

[versions]
# Toolchain
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
compileSdk = "37"
targetSdk = "37"
minSdk = "29"
jvmTarget = "17"

# AndroidX / Jetpack
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.10.2"
androidxHilt = "1.4.0"
androidxRoom = "2.8.5"
androidxDatastore = "1.2.1"
androidxGraphics = "1.0.4"
# androidx.ink is on the 1.1 alpha on purpose: 1.0.x keeps the custom-brush API (tips, behaviors)
# library-internal, which the brush pen and chisel highlighter need, and 1.1 fixes the stroke-end
# glitch. Pin exactly 1.1.0-alpha09 (no ranges, no auto-bumps) until 1.1 is stable.
androidxInk = "1.1.0-alpha09"
androidxMotionPrediction = "1.0.0"
composeBom = "2026.09.00"
material3Adaptive = "1.4.0"

# DI
hilt = "2.60.1"

# Kotlin libraries
coroutines = "1.11.0"
serialization = "1.11.0"

# Testing
junit4 = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

# Compose (versions from the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "material3Adaptive" }

# Storage
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "androidxDatastore" }

# Ink & low-latency rendering
androidx-ink-authoring = { group = "androidx.ink", name = "ink-authoring", version.ref = "androidxInk" }
androidx-ink-brush = { group = "androidx.ink", name = "ink-brush", version.ref = "androidxInk" }
androidx-ink-geometry = { group = "androidx.ink", name = "ink-geometry", version.ref = "androidxInk" }
androidx-ink-rendering = { group = "androidx.ink", name = "ink-rendering", version.ref = "androidxInk" }
androidx-ink-strokes = { group = "androidx.ink", name = "ink-strokes", version.ref = "androidxInk" }
androidx-ink-storage = { group = "androidx.ink", name = "ink-storage", version.ref = "androidxInk" }
androidx-input-motionprediction = { group = "androidx.input", name = "input-motionprediction", version.ref = "androidxMotionPrediction" }
androidx-graphics-core = { group = "androidx.graphics", name = "graphics-core", version.ref = "androidxGraphics" }

# DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }

# Kotlin
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Testing
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

# build-logic (convention plugin compile classpath)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "androidxRoom" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "androidxRoom" }

# Convention plugins (build-logic/convention)
bestnote-android-application = { id = "bestnote.android.application" }
bestnote-android-library = { id = "bestnote.android.library" }
bestnote-android-compose = { id = "bestnote.android.compose" }
bestnote-android-feature = { id = "bestnote.android.feature" }
bestnote-android-hilt = { id = "bestnote.android.hilt" }
bestnote-jvm-library = { id = "bestnote.jvm.library" }
